# Spectra application config
# See: https://github.com/spectra-app/spectra
# 詳細說明請參考專案根目錄的 spectraYaml.md

# OpenSpec directory path (relative to project root)
# Changing this requires rebuilding the vector search index.
# spec_dir: docs/specs

# Language for AI-generated artifacts
# 產出文件以繁體中文撰寫
locale: tw

# Workflow toggles
# tdd:    開啟測試驅動開發流程，確保每個功能都有測試保護
tdd: true
# audit:  變更完成時自動執行稽核，提升程式碼品質與可維護性
audit: true
# 允許平行執行子任務
parallel_tasks: true

# Claude slash commands (set true to also generate /spectra:X commands)
# 同時為 Claude Code 產生 /spectra:X 斜線指令，提升輸入體驗
claude_slash_commands: true

# 啟用 Git worktree 隔離分支
worktree: true

# worktree 自訂路徑
# worktrees_dir: .spectra/worktrees

# Claude Code skill effort levels (low/medium/high/xhigh/max)
# 此為要投入多少資源
claude_effort:
# 實作任務、寫程式
  apply: xhigh
  # 變更完成時稽核（安全、品質）
  audit: high
# 建立提案（What / Why）
  propose: medium

# spectra對claude比較多設定

# AI tools to generate instruction files for
# 本專案同時使用 Claude Code 與 Codex，兩者皆需產生對應的指引檔
tools:
  - claude
  - codex
#   - cursor
